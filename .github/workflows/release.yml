name: Release SudinChord

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      VITE_PARTY_SERVER_URL: https://api.bitchord.kushagrasingh.in

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build Web Frontend
        run: |
          cd app
          pnpm run build

      - name: Sync Desktop Assets
        run: node desktop/scripts/sync-assets.js

      - name: Build and Publish Electron App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @bitchord/desktop exec electron-builder --win -p always

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: SudinChord ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            desktop/dist-electron/SudinChord Setup *.exe
            desktop/dist-electron/latest.yml

